[project]
name = "cvalchemix"
version = "0.1.2"
description = "LinkedIn job scraper and CV analysis toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

authors = [{ name = "kayees", email = "kayesfardows@gmail.com" }]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "google-genai>=1.73.0",
    "jinja2>=3.1.6",
    "platformdirs>=4.9.6",
    "playwright>=1.58.0",
    "pydantic-settings>=2.13.1",
    "tenacity>=9.1.2",
    "typer[all]>=0.16.0",
]

[project.scripts]
cvalchemix = "cvalchemix.cli.main:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["cvalchemix*"]
