[project]
name = "browse"
version = "0.1.0"
description = "LinkedIn job scraper and CV analysis toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.73.0",
    "jinja2>=3.1.6",
    "platformdirs>=4.9.6",
    "playwright>=1.58.0",
    "pydantic-settings>=2.13.1",
    "tenacity>=9.1.2",
    "typer[all]>=0.16.0",
]

[project.scripts]
browse = "cli.main:main"
cvalchemix = "cli.main:app"
