[project]
name = "browse"
version = "0.1.0"
description = "LinkedIn job scraper and CV analysis toolkit"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-genai>=1.73.0",
    "playwright>=1.58.0",
    "pydantic-settings>=2.13.1",
    "tenacity>=9.1.2",
]

[project.scripts]
browse = "src.cli.main:main"
